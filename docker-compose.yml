services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres-1
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: wallets
    depends_on:
      - postgres-1

  postgres-1:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wallets
    ports:
      - "5432:5432"
