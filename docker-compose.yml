services:
  app:
    build: .
    ports:
      - "${APP_PORT}:8080"
    env_file:
      - config.env
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS}
    env_file:
      - config_user.env
    ports:
      - "${POSTGRES_PORT}:5432"
